<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartly: логотип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#18181B;--mut:#6B6B70;--line:#ECECEE;--soft:#F7F7F5;--tq:#00A6C8;--coral:#FF6B4A;--sun:#FFC23D;--leaf:#22A86A;--sky:#3D7BFF;--rose:#F0508C}
*{box-sizing:border-box} body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:48px 32px 80px}
h1{font:600 40px/1.1 "Inter Tight";letter-spacing:-.035em;margin:0 0 8px}.intro{color:var(--mut);margin:0 0 40px;max-width:46em}
.card{border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
.card h2{font:600 20px "Inter Tight";letter-spacing:-.02em;margin:0 0 6px}.card p{margin:0;color:var(--mut);font-size:14px}
.row{display:grid;grid-template-columns:1.4fr 1.4fr .7fr 1.6fr;gap:14px}
.tile{border-radius:14px;height:132px;display:grid;place-items:center;background:var(--soft)}.tile.dark{background:#111113;color:#fff}
.lock{display:flex;align-items:center;gap:10px;font:600 30px "Inter Tight";letter-spacing:-.035em}
.lock svg{width:40px;height:40px}
.icons{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.app{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgb(0 0 0 / .35)}.app svg{width:40px;height:40px}
.fav{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}.fav span{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:7px 7px 0 0;padding:4px 10px;color:var(--ink)}.fav svg{width:16px;height:16px}
.nav{border:1px solid var(--line);border-radius:14px;height:132px;display:flex;flex-direction:column;justify-content:center;padding:0 18px;gap:14px;background:#fff}
.nav .bar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut)}.nav .bar b{display:flex;align-items:center;gap:7px;font:600 16px "Inter Tight";letter-spacing:-.02em;color:var(--ink)}.nav svg{width:22px;height:22px}
.nav .cta{background:var(--ink);color:#fff;border-radius:7px;padding:5px 10px}
.pick{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#FFF5DB;color:#9A6A00}
@media (max-width:980px){.card{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<!-- символи логотипу -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1. Кошик-C: літера C як корзина візка, ручка й два колеса -->
    <symbol id="m-cart" viewBox="0 0 48 48"><path d="M35 12.4A14 14 0 1 0 35 33.6" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M35 12.4 43 8" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="17" cy="43" r="3.6" fill="#FF6B4A"/><circle cx="30" cy="43" r="3.6" fill="#00A6C8"/></symbol>
    <!-- 2. Пакет: бірюзовий пакет з ручкою, усередині біла C -->
    <symbol id="m-bag" viewBox="0 0 48 48"><path d="M17 17v-4a7 7 0 0 1 14 0v4" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/><rect x="7" y="16" width="34" height="29" rx="8" fill="#00A6C8"/><path d="M29.5 24.6a7 7 0 1 0 0 11.8" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/></symbol>
    <!-- 3. Веселка C: чотири дуги наших кольорів -->
    <symbol id="m-rainbow" viewBox="0 0 48 48"><path d="M38 9.8A20 20 0 1 0 38 38.2" fill="none" stroke="#00A6C8" stroke-width="5" stroke-linecap="round"/><path d="M34.4 14.6A14 14 0 1 0 34.4 33.4" fill="none" stroke="#FF6B4A" stroke-width="5" stroke-linecap="round"/><path d="M30.6 19.4A8 8 0 1 0 30.6 28.6" fill="none" stroke="#FFC23D" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="24" r="2.6" fill="#22A86A"/></symbol>
    <!-- 4. Мозаїка: чотири плитки-товари, одна кругла, разом читаються як C -->
    <symbol id="m-mosaic" viewBox="0 0 48 48"><rect x="4" y="4" width="18.5" height="18.5" rx="5" fill="#00A6C8"/><path d="M25.5 4H39a5 5 0 0 1 5 5v0A13.5 13.5 0 0 1 30.5 22.5h0a5 5 0 0 1-5-5z" fill="#FF6B4A"/><rect x="4" y="25.5" width="18.5" height="18.5" rx="5" fill="#FFC23D"/><path d="M25.5 30.5a5 5 0 0 1 5-5h0A13.5 13.5 0 0 1 44 39v0a5 5 0 0 1-5 5H25.5z" fill="#22A86A"/></symbol>
    <!-- 5. Вітрина: смугаста маркіза з чотирьох кольорів над магазином -->
    <symbol id="m-store" viewBox="0 0 48 48"><clipPath id="awn"><path d="M4 10a5 5 0 0 1 5-5h30a5 5 0 0 1 5 5v8H4z"/></clipPath><g clip-path="url(#awn)"><rect x="4" y="4" width="10" height="15" fill="#00A6C8"/><rect x="14" y="4" width="10" height="15" fill="#FF6B4A"/><rect x="24" y="4" width="10" height="15" fill="#FFC23D"/><rect x="34" y="4" width="10" height="15" fill="#22A86A"/></g><circle cx="9" cy="18" r="5" fill="#00A6C8"/><circle cx="19" cy="18" r="5" fill="#FF6B4A"/><circle cx="29" cy="18" r="5" fill="#FFC23D"/><circle cx="39" cy="18" r="5" fill="#22A86A"/><path d="M8 27v12a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V27" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M28 31.5a4.6 4.6 0 1 0 0 6.6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <!-- 6. Цінник: бірюзовий ярлик з отвором, усередині C -->
    <symbol id="m-tag" viewBox="0 0 48 48"><path d="M6 10a4 4 0 0 1 4-4h14.3a4 4 0 0 1 2.8 1.2l15 15a4 4 0 0 1 0 5.6L27.8 42.1a4 4 0 0 1-5.6 0l-15-15A4 4 0 0 1 6 24.3z" fill="#FF6B4A"/><circle cx="14" cy="14" r="3" fill="#fff"/><path d="M30.5 22.8a6.5 6.5 0 1 0 0 9.4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(45 26 27)"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <h1>Логотип Cartly</h1>
  <p class="intro">Шість ідей у стилі макету: прості геометричні форми, наші кольори, читається навіть у 16 пікселях. Кожна показана на світлому й темному тлі, іконкою застосунку, фавіконом і в шапці сайту. Назва «cartly» малими літерами: так дружніше, як у Notion і Linear.</p>
  <div id="list"></div>
</div>

<script>
const L = [
  ['m-cart', '1. Кошик-C', 'Літера C, з якої виходить візок: ручка зверху й два колеса наших кольорів. Одразу «покупки», і це перша літера назви.', true],
  ['m-bag', '2. Пакет', 'Бірюзовий пакет з ручкою, у ньому C. Покупка, магазин, доставка в одному знаку.', false],
  ['m-rainbow', '3. Веселка C', 'Чотири дуги наших кольорів складаються в C. Найяскравіший і найбільш «нотіонівський».', false],
  ['m-mosaic', '4. Мозаїка', 'Чотири плитки, як товари на вітрині. Дві з них заокруглені, тож разом вони читаються як C. Розвиток нинішнього знака.', false],
  ['m-store', '5. Вітрина', 'Смугаста маркіза з чотирьох кольорів над магазином з C на дверях. Буквально «свій магазин».', false],
  ['m-tag', '6. Цінник', 'Кораловий цінник з отвором, у ньому C. Про продажі й ціни, тепло й дружньо.', false],
];
const use = (id, color) => `<svg viewBox="0 0 48 48" style="color:${color}"><use href="#${id}"/></svg>`;
document.getElementById('list').innerHTML = L.map(([id, name, why, pick]) => `
  <div class="card">
    <div><h2>${name}</h2><p>${why}</p>${pick ? '<span class="pick">Мій вибір</span>' : ''}</div>
    <div class="row">
      <div class="tile"><div class="lock">${use(id, '#18181B')}cartly</div></div>
      <div class="tile dark"><div class="lock">${use(id, '#FFFFFF')}cartly</div></div>
      <div class="tile icons"><div class="app" style="background:#18181B">${use(id, '#FFFFFF')}</div><div class="fav"><span>${use(id, '#18181B')}Cartly</span></div></div>
      <div class="nav"><div class="bar"><b>${use(id, '#18181B')}cartly</b><span>Продукт · Тарифи</span><span class="cta">Почати</span></div><div class="bar" style="opacity:.5"><span>odiah.cartly.ua</span><span>Створено на Cartly ${use(id, '#18181B').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')}</span></div></div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
